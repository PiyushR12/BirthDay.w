<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Memory Box | Rupam</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      background: #0f0c29;
      background: linear-gradient(135deg, #24243e, #302b63, #0f0c29);
      color: white;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      user-select: none;
    }

    body::before, body::after {
      content: ''; position: absolute; width: 350px; height: 350px;
      border-radius: 50%; filter: blur(90px); z-index: -1;
      animation: orbFloat 12s infinite alternate ease-in-out;
    }
    body::before { background: #bc1888; top: 5%; left: 10%; }
    body::after { background: #f09433; bottom: 5%; right: 10%; animation-delay: -6s; }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      100% { transform: translate(40px, 40px) scale(1.3); opacity: 0.7; }
    }

    header {
      text-align: center;
      z-index: 10;
      margin-top: 5px;
    }

    header h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
    }

    header p {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
    }

    /* 3D Box Stage */
    .scene {
      width: 250px;
      height: 250px;
      perspective: 1400px;
      margin: auto;
      cursor: grab;
    }

    .scene:active { cursor: grabbing; }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: translateZ(-125px) rotateX(-15deg) rotateY(25deg);
      animation: rotateCube 25s infinite linear;
      transition: transform 0.1s ease-out;
    }

    @keyframes rotateCube {
      0% { transform: translateZ(-125px) rotateX(0deg) rotateY(0deg); }
      100% { transform: translateZ(-125px) rotateX(360deg) rotateY(360deg); }
    }

    .cube-face {
      position: absolute;
      width: 250px;
      height: 250px;
      background: rgba(255, 255, 255, 0.08);
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(188, 24, 136, 0.4);
      backdrop-filter: blur(5px);
      transition: transform 0.8s ease-in-out;
    }

    .cube-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Original 3D Face Positions */
    .cube-face-front  { transform: rotateY(0deg) translateZ(125px); }
    .cube-face-back   { transform: rotateY(180deg) translateZ(125px); }
    .cube-face-right  { transform: rotateY(90deg) translateZ(125px); }
    .cube-face-left   { transform: rotateY(-90deg) translateZ(125px); }
    .cube-face-top    { transform: rotateX(90deg) translateZ(125px); }
    .cube-face-bottom { transform: rotateX(-90deg) translateZ(125px); }
    
    /* Extra faces tucked inside for the box opening effect */
    .cube-face-in1    { transform: rotateY(0deg) translateZ(40px); }
    .cube-face-in2    { transform: rotateY(180deg) translateZ(40px); }
    .cube-face-in3    { transform: rotateY(90deg) translateZ(40px); }
    .cube-face-in4    { transform: rotateY(-90deg) translateZ(40px); }

    /* OPEN BOX STATE: Flaps open outward like a treasure box */
    body.open-box .cube {
      animation: none !important;
    }

    body.open-box .cube-face-top {
      transform: rotateX(180deg) translateZ(230px) scale(1.1);
    }
    body.open-box .cube-face-bottom {
      transform: rotateX(-180deg) translateZ(230px) scale(1.1);
    }
    body.open-box .cube-face-front {
      transform: rotateY(0deg) translateZ(210px) scale(1.1);
    }
    body.open-box .cube-face-back {
      transform: rotateY(180deg) translateZ(210px) scale(1.1);
    }
    body.open-box .cube-face-right {
      transform: rotateY(90deg) translateZ(210px) scale(1.1);
    }
    body.open-box .cube-face-left {
      transform: rotateY(-90deg) translateZ(210px) scale(1.1);
    }
    /* Inner photos bloom outward from inside the box */
    body.open-box .cube-face-in1 { transform: rotateY(45deg) translateZ(130px) scale(1.05); }
    body.open-box .cube-face-in2 { transform: rotateY(-45deg) translateZ(130px) scale(1.05); }
    body.open-box .cube-face-in3 { transform: rotateX(45deg) translateZ(130px) scale(1.05); }
    body.open-box .cube-face-in4 { transform: rotateX(-45deg) translateZ(130px) scale(1.05); }

    /* Heartfelt Footer Note */
    .footer-note {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      border-radius: 20px;
      max-width: 480px;
      width: 90%;
      margin-bottom: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      z-index: 10;
    }

    .footer-note p {
      font-size: 0.9rem;
      color: #fce4ec;
      line-height: 1.4;
    }

    .footer-note span {
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem;
      color: #ff99c8;
      display: block;
      margin-top: 3px;
    }
  </style>
</head>
<body>

  <!-- Audio Element for the Box Opening Song -->
  <audio id="boxSong" src="Last-tone.mp3" preload="auto"></audio>

  <header>
    <h1>Our Special Memory Box 💖</h1>
    <p id="instructionText">Swipe/Drag to rotate • Tap to open box!</p>
  </header>

  <div class="scene" id="scene">
    <div class="cube" id="cube">
      <!-- 6 Main Faces -->
      <div class="cube-face cube-face-front">
        <img src="20260606_222417-IMG_STYLE.jpg" alt="Memory">
      </div>
      <div class="cube-face cube-face-back">
        <img src="Screenshot_20260922-235014_Chrome~2.jpg" alt="Memory">
      </div>
      <div class="cube-face cube-face-right">
        <img src="Screenshot_20260923-005924_Chrome.png" alt="Memory">
      </div>
      <div class="cube-face cube-face-left">
        <img src="Screenshot_20260923-011101_Chrome~2.jpg" alt="Memory">
      </div>
      <div class="cube-face cube-face-top">
        <img src="Screenshot_20260923-011022_Chrome~2.jpg" alt="Memory">
      </div>
      <div class="cube-face cube-face-bottom">
        <img src="Screenshot_20260923-011050_Chrome~2.jpg" alt="Memory">
      </div>
      <!-- 4 Inner Faces revealing all 10 images -->
      <div class="cube-face cube-face-in1">
        <img src="Screenshot_20260923-011824_Chrome.png" alt="Memory">
      </div>
      <div class="cube-face cube-face-in2">
        <img src="Screenshot_20260923-011555_Chrome.png" alt="Memory">
      </div>
      <div class="cube-face cube-face-in3">
        <img src="Screenshot_20260923-011450_Chrome.png" alt="Memory">
      </div>
      <div class="cube-face cube-face-in4">
        <img src="Screenshot_20260923-011036_Chrome~2.jpg" alt="Memory">
      </div>
    </div>
  </div>

  <div class="footer-note">
    <p>Every single picture tells a story of how much brightness you bring into my world. Thank you for being you.</p>
    <span>Forever yours beast, Piyush 🤍</span>
  </div>

  <script>
    const cube = document.getElementById('cube');
    const scene = document.getElementById('scene');
    const boxSong = document.getElementById('boxSong');
    let isOpen = false;
    let isDragging = false;
    let startX, startY;
    let rotX = -15, rotY = 25;
    let dragDistance = 0;

    // Toggle Box Open/Close on Tap & Play Music
    scene.addEventListener('click', (e) => {
      if (dragDistance < 6) {
        isOpen = !isOpen;
        document.body.classList.toggle('open-box', isOpen);
        
        const instruction = document.getElementById('instructionText');
        if (isOpen) {
          boxSong.play().catch(err => console.log("Audio play blocked:", err));
          instruction.innerText = "Drag to look around inside • Tap to close box ✨";
        } else {
          boxSong.pause();
          boxSong.currentTime = 0;
          instruction.innerText = "Swipe/Drag to rotate • Tap to open box!";
        }
      }
    });

    // Touch & Mouse Drag Rotation Controls
    scene.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      dragDistance = 0;
      cube.style.animation = 'none'; // Pause auto-spin during interaction
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;
      
      dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

      rotY += deltaX * 0.6;
      rotX -= deltaY * 0.6;

      cube.style.transform = `translateZ(-125px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });
  </script>
</body>
</html>

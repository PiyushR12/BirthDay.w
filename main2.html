<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make a Wish! | Rupam</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body {
      background: #0f0c29;
      background: linear-gradient(135deg, #1b1636, #2d2657, #0a081a);
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    body::before, body::after {
      content: ''; position: absolute; width: 340px; height: 340px;
      border-radius: 50%; filter: blur(95px); z-index: -1;
      animation: orbFloat 10s infinite alternate ease-in-out;
    }
    body::before { background: #bc1888; top: 8%; left: 15%; }
    body::after { background: #f09433; bottom: 8%; right: 15%; animation-delay: -5s; }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); opacity: 0.45; }
      100% { transform: translate(45px, 45px) scale(1.25); opacity: 0.75; }
    }

    .container {
      position: relative;
      width: 92%; max-width: 440px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    }

    h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.7rem;
      margin-bottom: 6px;
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Candle Rack */
    .candle-stage {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 24px;
      margin: 30px 0 6px 0;
      height: 85px;
    }

    .candle-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    /* Animated CSS Flame */
    .flame {
      width: 14px;
      height: 24px;
      background: linear-gradient(to bottom, #fff, #ffd200 45%, #ff5100);
      border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
      box-shadow: 0 0 16px #ffae00, 0 0 32px #ff4500;
      opacity: 0;
      transform: scale(0.2);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: flameWiggle 0.8s infinite alternate ease-in-out;
    }

    .candle-wrapper.lit .flame {
      opacity: 1;
      transform: scale(1);
    }

    @keyframes flameWiggle {
      0% { transform: scale(1) rotate(-3deg); }
      100% { transform: scale(1.08) rotate(3deg); }
    }

    .wick {
      width: 2px;
      height: 7px;
      background: #444;
      margin-top: 1px;
    }

    .stick {
      width: 12px;
      height: 48px;
      background: repeating-linear-gradient(45deg, #ff758c, #ff758c 6px, #fff 6px, #fff 12px);
      border-radius: 4px 4px 2px 2px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    }

    .smoke {
      position: absolute;
      top: -12px;
      font-size: 1.1rem;
      opacity: 0;
      pointer-events: none;
    }

    .candle-wrapper.blown .flame {
      display: none;
    }

    .candle-wrapper.blown .smoke {
      animation: smokeRise 1.2s forwards ease-out;
    }

    @keyframes smokeRise {
      0% { opacity: 0.9; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-30px) scale(1.8); filter: blur(3px); }
    }

    .cake {
      font-size: 80px;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,0.4));
      line-height: 1;
      margin-bottom: 12px;
    }

    .instruction {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      min-height: 24px;
      transition: color 0.3s;
    }

    /* Blow Action Button */
    .blow-btn {
      display: none;
      margin: 14px auto 0 auto;
      padding: 10px 24px;
      background: linear-gradient(45deg, #f09433, #dc2743);
      border: none;
      border-radius: 20px;
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(240, 148, 51, 0.6);
      animation: pulseBtn 1.2s infinite alternate;
    }

    @keyframes pulseBtn {
      0% { transform: scale(0.97); }
      100% { transform: scale(1.05); }
    }

    /* Polaroid Card Popup */
    .popup-card {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #fdfaf6;
      padding: 16px 16px 20px 16px;
      border-radius: 12px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.85);
      text-align: center;
      z-index: 100;
      transition: transform 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      width: 290px;
      color: #222;
    }

    .popup-card.show {
      transform: translate(-50%, -50%) scale(1);
    }

    .popup-card h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      text-align: left;
    }

    .popup-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 8px;
    }

    .popup-card .caption {
      font-family: 'Dancing Script', cursive;
      font-size: 1.6rem;
      margin: 8px 0 10px 0;
      color: #b31942;
      text-align: left;
    }

    .popup-btn, .action-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
      border: none;
      border-radius: 20px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(220, 39, 67, 0.4);
      transition: transform 0.2s;
    }

    .action-btn {
      display: none;
      margin-top: 15px;
      font-size: 1rem;
    }

    .popup-btn:hover, .action-btn:hover { transform: scale(1.03); }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="birthdaySong" src="birthday-song.mp3" preload="auto"></audio>

  <div class="container" id="mainContainer">
    <h2>Make a Wish! 🎂</h2>
    
    <!-- 3 Animated Candles -->
    <div class="candle-stage">
      <div class="candle-wrapper" id="candle-0" onclick="lightCandle(0)">
        <div class="flame"></div>
        <div class="smoke">💨</div>
        <div class="wick"></div>
        <div class="stick"></div>
      </div>
      <div class="candle-wrapper" id="candle-1" onclick="lightCandle(1)">
        <div class="flame"></div>
        <div class="smoke">💨</div>
        <div class="wick"></div>
        <div class="stick"></div>
      </div>
      <div class="candle-wrapper" id="candle-2" onclick="lightCandle(2)">
        <div class="flame"></div>
        <div class="smoke">💨</div>
        <div class="wick"></div>
        <div class="stick"></div>
      </div>
    </div>

    <div class="cake">🎂</div>
    
    <div class="instruction" id="instructionText">Tap each candle to light it up! ✨ (0/3)</div>

    <!-- Active Blow Button -->
    <button class="blow-btn" id="blowBtn" onclick="blowAllCandles()">Make a Wish & Blow! 🌬️</button>

    <!-- Main Gift Button -->
    <button class="action-btn" id="giftBtn" onclick="window.location.href='last.html'">Open Your Memory Box 🎁</button>
  </div>

  <!-- Polaroid Card Popup -->
  <div class="popup-card" id="popupCard">
    <h3>U see this ?</h3>
    <img src="Screenshot_20260922-235014_Chrome~2.jpg" alt="Fav one">
    <div class="caption">My fav one!! 💖</div>
    <button class="popup-btn" onclick="window.location.href='last.html'">Open 3D Cube Gift 🎁</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <script>
    const candleState = [false, false, false];
    let allLit = false;
    let hasBlown = false;

    function lightCandle(index) {
      if (allLit || candleState[index]) return;

      candleState[index] = true;
      document.getElementById(`candle-${index}`).classList.add('lit');

      // Small spark confetti on touch
      confetti({
        particleCount: 15,
        spread: 40,
        origin: { y: 0.52 }
      });

      const litCount = candleState.filter(Boolean).length;

      if (litCount < 3) {
        document.getElementById('instructionText').innerText = `Keep lighting! (${litCount}/3)`;
      } else {
        allLit = true;
        document.getElementById('instructionText').innerText = "All candles are shining bright! Now close your eyes...";
        document.getElementById('blowBtn').style.display = 'inline-block';
      }
    }

    function blowAllCandles() {
      if (hasBlown) return;
      hasBlown = true;

      document.getElementById('blowBtn').style.display = 'none';

      // Extinguish candles with smoke puff
      for (let i = 0; i < 3; i++) {
        const el = document.getElementById(`candle-${i}`);
        el.classList.remove('lit');
        el.classList.add('blown');
      }

      document.getElementById('instructionText').innerText = "Wish made! May all your dreams come true ✨";

      // Trigger Birthday Song
      const song = document.getElementById('birthdaySong');
      song.play().catch(err => console.log("Audio autoplay prevented:", err));

      // Grand Confetti Blast Wave 1
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });

      // Grand Confetti Blast Wave 2
      setTimeout(() => {
        confetti({
          particleCount: 120,
          spread: 100,
          origin: { y: 0.55 }
        });
      }, 350);

      // Reveal Polaroid Card and navigation button
      setTimeout(() => {
        document.getElementById('popupCard').classList.add('show');
        document.getElementById('giftBtn').style.display = 'inline-block';
      }, 950);
    }
  </script>
</body>
</html>
